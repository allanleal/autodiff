name: osx

on:
  push:
    branches:
      - main

  pull_request:

  schedule:
    - cron: "0 5 * * 1"  # runs at 05:00 UTC on Mondays

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.config }} build on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      max-parallel: 4
      matrix:
        os: ["macos-latest"]
        python-version: [3.11]
        config: ["Release"]

    steps:
      - uses: actions/checkout@v3

      - name: Timestamp  # Idea from https://tinyurl.com/47wz7vpv
        id: timestamp
        shell: cmake -P {0}
        run: |
          string(TIMESTAMP current_date "%Y-%m-%d-%H;%M;%S" UTC)
          message("::set-output name=now::${current_date}")

      - name: Configuring Cache
        id: cache
        uses: actions/cache@v3
        with:
          path: $HOME/.ccache
          key: ${{ runner.os }}-ccache

      - name: Configuring Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          miniforge-version: latest

      - name: Configuring Conda Environment
        shell: bash -el {0}
        run: |
          conda activate autodiff
          cmake -S . -B .build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DAUTODIFF_TEST_SANITIZE=ON
      - name: Build
        shell: bash -l {0}
        run: |
          conda activate autodiff
          ccache -s
          ccache -z
          cmake --build .build --parallel 3
          ccache -s
      - name: Install
        shell: bash -l {0}
        run: |
          conda activate autodiff
          cmake --build .build --target install
      - name: Test
        shell: bash -l {0}
        run: |
          conda activate autodiff
          cmake -S . -B .build -DCMAKE_BUILD_TYPE=Debug
          cmake --build .build --target tests --parallel 3
